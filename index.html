<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="livvy don't surf">
<title>livvy don't surf</title>    
<link rel="icon" href="img/favicon.png"/>
<style>
html{
background-color: black;
overflow: hidden;
}
body{
position: relative;
width: 100%;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}
#projection{
display: block;
width: 50vw;
height: auto;
transition: opacity 0.5s ease-in-out;
opacity: 1;
}
</style>
</head>
<body>
<img onmouseover="stack('car')" onmouseleave="unstack()" id="projection" src="img/4.png">
</body>
<script>
function stack(x){
switch (x) {
case 'car':
    {
        document.getElementById("projection").src="img/5.png"
    };
    break;
}}
function unstack(){
document.getElementById("projection").src="img/4.png";
}
</script>
</html>
